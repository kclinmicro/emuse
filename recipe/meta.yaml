{% set name = "emuse" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # Update the sha256 after tagging a release, e.g.:
  #   curl -sL https://github.com/kclinmicro/emuse/archive/refs/tags/v{{ version }}.tar.gz | sha256sum
  url: https://github.com/kclinmicro/emuse/archive/refs/tags/v{{ version }}.tar.gz
  sha256: REPLACE_WITH_SHA256_OF_RELEASE_TARBALL

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - emuse = emuse.make_report:main

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=64
  run:
    - python >=3.11
    - jinja2
    - pandas
    - pyyaml
    - pysam

test:
  commands:
    - emuse --help


about:
  home: https://github.com/kclinmicro/emuse
  summary: Report generator for the TRANA 16S rRNA taxonomic profiling pipeline
  description: |
    Emuse parses and reports on taxonomic abundance and alignment output
    produced by Emu (https://github.com/treangenlab/emu), which is run as
    part of the upstream TRANA pipeline. See THIRD_PARTY_LICENSES.txt for
    Emu's license and attribution.
  license: MIT
  license_file:
    - LICENSE
    - THIRD_PARTY_LICENSES.txt

extra:
  recipe-maintainers:
    - kclinmicro
